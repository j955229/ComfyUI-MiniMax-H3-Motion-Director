name: Diagnose Mixed Patch Matches

on:
  push:
    branches: [feature/mixed-mode]
    paths:
      - '.github/workflows/diagnose_mixed_output_patch.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mixed-mode
      - name: Locate duplicate target
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('web/js/minimax_timeline.js').read_text(encoding='utf-8')
          pattern = '        if (this.isGenBlank() || this.isImageBatch() || this.isFl2vMode()) {\n            const out = this.timeline.output || {};'
          start = 0
          while True:
              pos = t.find(pattern, start)
              if pos < 0:
                  break
              line = t.count('\n', 0, pos) + 1
              print('preview_branch line', line)
              print(t[pos-180:pos+260])
              start = pos + 1
          PY
