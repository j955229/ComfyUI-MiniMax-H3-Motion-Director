name: Apply Face Refine Handoff

on:
  push:
    branches:
      - work/face-refine-handoff-v10
    paths:
      - tools/_apply_face_refine_handoff.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/face-refine-handoff-v10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply precise source patch
        run: python tools/_apply_face_refine_handoff.py
      - name: Compile Python sources
        run: python -m compileall -q director tests
      - name: Install focused test dependencies
        run: |
          python -m pip install -q pytest numpy pillow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run focused regression tests
        run: |
          pytest -q \
            tests/test_face_refine_streaming.py \
            tests/test_face_refine_sam_validation.py \
            tests/test_model_paths.py \
            tests/test_audio_context_refresh.py \
            tests/test_motion_context_repin.py \
            tests/test_motion_context_visual_validity.py \
            tests/test_executor_face_refine_handoff_contract.py \
            tests/test_postprocess_boot_token_v10.py
      - name: Run JS tests
        run: node --test tests_js/*.test.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm -f tools/_apply_face_refine_handoff.py
          rm -f .github/workflows/_apply_face_refine_handoff.yml
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- director web/js tests tests_js .github/workflows/_apply_face_refine_handoff.yml tools/_apply_face_refine_handoff.py
          git diff --cached --check
          git commit -m "fix: make Face Refine segment-final before Motion Context"
          git push origin HEAD:work/face-refine-handoff-v10
