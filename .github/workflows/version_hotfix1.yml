name: One-shot v1.1.5 HotFix#1 version update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/version_hotfix1.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update release-facing and registry versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("pyproject.toml"): [
                  ('version = "1.1.5"', 'version = "1.1.6"'),
              ],
              Path("README.md"): [
                  ('![Version](https://img.shields.io/badge/version-v1.1.5-2ea44f)', '![Version](https://img.shields.io/badge/version-v1.1.5%20HotFix%231-2ea44f)'),
                  ('> Current version: **v1.1.5**', '> Current version: **v1.1.5 HotFix#1** · Registry package: **1.1.6**'),
              ],
              Path("README_zh.md"): [
                  ('![Version](https://img.shields.io/badge/version-v1.1.5-2ea44f)', '![Version](https://img.shields.io/badge/version-v1.1.5%20HotFix%231-2ea44f)'),
                  ('> 当前版本：**v1.1.5**', '> 当前版本：**v1.1.5 HotFix#1** · Registry 包版本：**1.1.6**'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print(f"updated {path}")
          PY

      - name: Verify version metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert data["project"]["version"] == "1.1.6"

          en = Path("README.md").read_text(encoding="utf-8")
          zh = Path("README_zh.md").read_text(encoding="utf-8")
          assert "v1.1.5 HotFix#1" in en
          assert "Registry package: **1.1.6**" in en
          assert "v1.1.5 HotFix#1" in zh
          assert "Registry 包版本：**1.1.6**" in zh
          print("version metadata verified")
          PY
          git diff --check

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/version_hotfix1.yml
          git add pyproject.toml README.md README_zh.md
          git diff --cached --check
          git commit -m "chore: mark v1.1.5 HotFix#1"
          git push origin HEAD:main
