name: Apply Mixed Frame Source UI

on:
  push:
    branches:
      - feature/mixed-mode
    paths:
      - ".github/scripts/apply_mixed_slot_result_ui.py"
      - ".github/workflows/apply_mixed_slot_result_ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mixed-mode
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply UI patch
        run: python .github/scripts/apply_mixed_slot_result_ui.py
      - name: Check syntax
        run: |
          node --check web/js/minimax_mixed_native_inputs.mjs
          node --check web/js/minimax_mixed_i18n.mjs
      - name: Verify integrated result controls
        run: |
          grep -q 'mmx-mixed-slot-tools' web/js/minimax_mixed_native_inputs.mjs
          grep -q 'resultAdvancedVisibility' web/js/minimax_mixed_native_inputs.mjs
          ! grep -q 'appendSingleResultAction' web/js/minimax_mixed_native_inputs.mjs
      - name: Commit production file
        run: |
          git config user.name "j955229"
          git config user.email "120770154+j955229@users.noreply.github.com"
          git add web/js/minimax_mixed_native_inputs.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "ui: integrate Mixed frame source controls into native slots"
          git push origin HEAD:feature/mixed-mode
