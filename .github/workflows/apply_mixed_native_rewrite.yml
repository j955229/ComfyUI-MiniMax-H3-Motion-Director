name: Apply Mixed Native Rewrite

on:
  push:
    branches:
      - feature/mixed-mode
    paths:
      - "scripts/apply_mixed_native_rewrite.py"
      - ".github/workflows/apply_mixed_native_rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mixed-mode
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply strict native Mixed rewrite
        run: python scripts/apply_mixed_native_rewrite.py

      - name: Syntax checks
        run: |
          node --check web/js/minimax_timeline.js
          node --check web/js/minimax_gen_timeline.js
          node --check web/js/minimax_mixed_ui_v2.mjs
          node --check web/js/tests/minimax_mixed_native_contract.test.mjs
          git diff --check

      - name: Commit native rewrite
        run: |
          if git diff --quiet --exit-code; then
            echo "No rewrite changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/js .github/workflows/mixed_mode_browser_ci.yml
          git commit -m "refactor: integrate Mixed into native Director state machine"
          git push origin HEAD:feature/mixed-mode
