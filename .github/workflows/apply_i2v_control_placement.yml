name: Apply I2V Control Placement

on:
  push:
    branches:
      - feature/mixed-mode
    paths:
      - ".github/scripts/move_i2v_controls_outside_slot.py"
      - ".github/workflows/apply_i2v_control_placement.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mixed-mode
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply I2V layout fix
        run: python .github/scripts/move_i2v_controls_outside_slot.py
      - name: Syntax check
        run: |
          node --check web/js/minimax_mixed_native_inputs.mjs
          node --check web/js/minimax_mixed_ui_v2.mjs
          node --check web/js/minimax_mixed_ui.mjs
          node --check web/js/minimax_timeline.js
      - name: Verify placement
        run: |
          grep -q 'mmx-mixed-i2v-actions' web/js/minimax_mixed_native_inputs.mjs
          grep -q 'controlsHost: actions' web/js/minimax_mixed_native_inputs.mjs
          grep -q 'advancedHost: advanced' web/js/minimax_mixed_native_inputs.mjs
          grep -q 'mixed_native_v6' web/js/minimax_timeline.js
      - name: Commit fix
        run: |
          git config user.name "j955229"
          git config user.email "120770154+j955229@users.noreply.github.com"
          git add web/js/minimax_mixed_native_inputs.mjs web/js/minimax_mixed_ui_v2.mjs web/js/minimax_mixed_ui.mjs web/js/minimax_timeline.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: move Mixed I2V controls beside source preview"
          git push origin HEAD:feature/mixed-mode
