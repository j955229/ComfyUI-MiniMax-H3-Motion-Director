name: Report Timing Progress Fix Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/report_timing_progress_fix_once.yml"

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test runner
        run: python -m pip install --quiet pytest

      - name: Write regression tests first
        shell: bash
        run: |
          cat > tests/test_execution_report_timing.py <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          path = ROOT / "director" / "execution_report.py"
          spec = importlib.util.spec_from_file_location("director_execution_report_test", path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          def test_timing_section_and_helpers():
              assert "Timing" in mod.SECTION_ORDER
              assert mod.fmt_seconds(0) == "0.00s"
              assert mod.fmt_seconds(65.25) == "1m 05.25s"
              report = "Director Report\n\n[Final]\nStatus: SUCCESS"
              updated = mod.append_report_section_lines(report, "Timing", ["Pipeline Total: 1.00s"])
              assert "[Timing]\nPipeline Total: 1.00s" in updated
          PY

          cat > tests/test_progress_precision_static.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def text(path):
              return (ROOT / path).read_text(encoding="utf-8")

          def test_progress_uses_weighted_phases_and_elapsed_time():
              src = text("director/progress.py")
              assert "SEGMENT_PHASES" in src
              assert "GLOBAL_PHASES" in src
              assert "PHASE_WEIGHTS" in src
              assert '"elapsed_seconds"' in src
              assert '"phase_elapsed_seconds"' in src

          def test_sampler_reports_every_real_step_even_without_preview():
              src = text("director/core_sampling.py")
              assert "notify(phase_name" in src
              assert "total_steps" in src
              assert "int(step) + 1" in src

          def test_reports_include_stage_timings_and_postprocess_diagnostics():
              executor = text("director/executor_core.py")
              refine = text("director/refine_sampling.py")
              face = text("director/face_refine_pipeline.py")
              node = text("nodes/director.py")
              assert "segment_stage_timings" in executor
              assert "VSR Quality:" in executor
              assert "Detection Rate:" in executor
              assert "Source Resolution:" in executor
              assert "Adaptive Strength min/mean/max:" in executor
              assert "sampling_chunks" in face
              assert 'timings["upscale"]' in refine
              assert "Pipeline Total:" in node
              assert "Video Encode / Auto Save:" in node
              assert "End-to-end Total:" in node
          PY

          cat > web/js/tests/minimax_progress_elapsed.test.mjs <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const src = fs.readFileSync(new URL("../minimax_timeline.js", import.meta.url), "utf8");
          assert.match(src, /elapsed_seconds/);
          assert.match(src, /phase_elapsed_seconds/);
          assert.match(src, /已用/);
          assert.match(src, /当前阶段/);
          console.log("progress elapsed UI test passed");
          JS

      - name: Verify tests are red before implementation
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_execution_report_timing.py tests/test_progress_precision_static.py > /tmp/red-py.log 2>&1
          py_status=$?
          node web/js/tests/minimax_progress_elapsed.test.mjs > /tmp/red-js.log 2>&1
          js_status=$?
          set -e
          cat /tmp/red-py.log
          cat /tmp/red-js.log
          if [ "$py_status" -eq 0 ] || [ "$js_status" -eq 0 ]; then
            echo "Expected both new regression suites to fail before implementation."
            exit 1
          fi
          echo "Regression tests failed as expected."

      - name: Implement timing report and precise progress
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # execution_report.py
          p = 'director/execution_report.py'
          s = read(p)
          s = replace_once(s, '    "Face Refine",\n    "Preview",', '    "Face Refine",\n    "Timing",\n    "Preview",', 'Timing section')
          anchor = '''def fmt_float(value: Any) -> str:\n    if value is None:\n        return "n/a"\n    return f"{float(value):.6f}"\n'''
          addition = anchor + '''\n\ndef fmt_seconds(value: Any) -> str:\n    if value is None:\n        return "n/a"\n    seconds = max(0.0, float(value))\n    if seconds < 60.0:\n        return f"{seconds:.2f}s"\n    minutes = int(seconds // 60)\n    remain = seconds - minutes * 60\n    return f"{minutes}m {remain:05.2f}s"\n\n\ndef append_report_section_lines(report: str, section: str, lines) -> str:\n    clean = [str(line) for line in lines if str(line).strip()]\n    if not clean:\n        return str(report or "")\n    text = str(report or "").rstrip()\n    marker = f"[{section}]"\n    payload = "\\n".join(clean)\n    start = text.find(marker)\n    if start < 0:\n        return text + f"\\n\\n{marker}\\n{payload}"\n    next_section = text.find("\\n\\n[", start + len(marker))\n    if next_section < 0:\n        return text + "\\n" + payload\n    return text[:next_section].rstrip() + "\\n" + payload + text[next_section:]\n'''
          s = replace_once(s, anchor, addition, 'report helpers')
          s = replace_once(s, '    "DirectorExecutionReport",\n    "fmt_float",', '    "DirectorExecutionReport",\n    "append_report_section_lines",\n    "fmt_float",\n    "fmt_seconds",', 'report exports')
          write(p, s)

          # progress.py
          p = 'director/progress.py'
          s = read(p)
          s = replace_once(s, 'import logging\nimport base64', 'import logging\nimport time\nimport base64', 'progress time import')
          old_phases = '''DIRECTOR_PHASES = (\n    "prepare",\n    "context_encode",\n    "sample",\n    "global_upscale",\n    "global_refine",\n    "decode",\n    "assemble",\n    "face_refine",\n    "finalize",\n)\n'''
          new_phases = old_phases + '''\nSEGMENT_PHASES = ("prepare", "context_encode", "sample", "global_upscale", "global_refine", "decode")\nGLOBAL_PHASES = ("assemble", "face_refine", "finalize")\nPHASE_WEIGHTS = {\n    "prepare": 1.0,\n    "context_encode": 1.5,\n    "sample": 8.0,\n    "global_upscale": 5.0,\n    "global_refine": 4.0,\n    "decode": 2.0,\n    "assemble": 1.0,\n    "face_refine": 8.0,\n    "finalize": 1.0,\n}\n_RUN_STARTED: dict[str, float] = {}\n_PHASE_STARTED: dict[str, tuple[str, float]] = {}\n'''
          s = replace_once(s, old_phases, new_phases, 'weighted progress phases')
          start = s.index('def report_director_progress(')
          end = s.index('\n\ndef report_director_segment_preview', start)
          new_func = '''def report_director_progress(\n    node_id: str | None,\n    *,\n    segment_index: int,\n    segment_total: int,\n    phase: str,\n    phase_value: float = 0,\n    phase_max: float = 1,\n    frames_label: str = "",\n    task_key: str = "",\n    timeline_segment_index: int | None = None,\n    timeline_segment_total: int | None = None,\n) -> None:\n    if not node_id:\n        return\n    key = str(node_id)\n    now = time.perf_counter()\n    if phase == "plan" or key not in _RUN_STARTED:\n        _RUN_STARTED[key] = now\n    previous_phase = _PHASE_STARTED.get(key)\n    if previous_phase is None or previous_phase[0] != phase:\n        _PHASE_STARTED[key] = (phase, now)\n    phase_started = _PHASE_STARTED[key][1]\n\n    phase_fraction = max(0.0, min(1.0, float(phase_value) / max(float(phase_max), 1e-9)))\n    segment_weight = sum(PHASE_WEIGHTS[name] for name in SEGMENT_PHASES)\n    global_weight = sum(PHASE_WEIGHTS[name] for name in GLOBAL_PHASES)\n    overall_max = max(1.0, max(1, int(segment_total)) * segment_weight + global_weight)\n    if phase in SEGMENT_PHASES:\n        offset = sum(PHASE_WEIGHTS[name] for name in SEGMENT_PHASES[:SEGMENT_PHASES.index(phase)])\n        overall_value = max(0, int(segment_index)) * segment_weight + offset + PHASE_WEIGHTS[phase] * phase_fraction\n    elif phase in GLOBAL_PHASES:\n        offset = sum(PHASE_WEIGHTS[name] for name in GLOBAL_PHASES[:GLOBAL_PHASES.index(phase)])\n        overall_value = max(1, int(segment_total)) * segment_weight + offset + PHASE_WEIGHTS[phase] * phase_fraction\n    elif phase == "finish":\n        overall_value = overall_max\n    else:\n        overall_value = 0.0\n    overall_value = min(overall_max, overall_value)\n    remaining_segments = max(0, int(segment_total) - int(segment_index) - 1)\n    if phase == "finish":\n        remaining_segments = 0\n\n    timeline_seg = timeline_segment_index + 1 if timeline_segment_index is not None else segment_index + 1\n    timeline_total = timeline_segment_total if timeline_segment_total is not None else segment_total\n    partial_run = timeline_segment_total is not None and segment_total < timeline_segment_total\n    payload = {\n        "node_id": key,\n        "segment": segment_index + 1,\n        "segment_total": segment_total,\n        "timeline_segment": timeline_seg,\n        "timeline_segment_total": timeline_total,\n        "partial_run": partial_run,\n        "phase": phase,\n        "phase_label": PHASE_LABELS.get(phase, phase),\n        "phase_value": phase_value,\n        "phase_max": phase_max,\n        "overall_value": overall_value,\n        "overall_max": overall_max,\n        "remaining_segments": remaining_segments,\n        "frames_label": frames_label,\n        "task_key": task_key,\n        "elapsed_seconds": max(0.0, now - _RUN_STARTED.get(key, now)),\n        "phase_elapsed_seconds": max(0.0, now - phase_started),\n    }\n    try:\n        from server import PromptServer\n        srv = PromptServer.instance\n        if srv:\n            srv.send_sync("minimax_motion_director_progress", payload, srv.client_id)\n            srv.send_progress_text("", key)\n    except Exception as exc:\n        log.debug("Director progress send skipped: %s", exc)\n    try:\n        from comfy_execution.progress import get_progress_state\n        get_progress_state().update_progress(key, overall_value, overall_max)\n    except Exception:\n        pass\n    if phase == "finish":\n        _RUN_STARTED.pop(key, None)\n        _PHASE_STARTED.pop(key, None)\n'''
          s = s[:start] + new_func + s[end:]
          write(p, s)

          # core_sampling.py -- sampler callback drives actual step progress even with preview off.
          p = 'director/core_sampling.py'
          s = read(p)
          s = replace_once(s, '''    def callback(step, x0, x, total_steps):\n        if on_step_preview is not None and not preview_wrapped:\n''', '''    def callback(step, x0, x, total_steps):\n        notify(phase_name, min(1.0, (int(step) + 1) / max(1, int(total_steps))))\n        if on_step_preview is not None and not preview_wrapped:\n''', 'real sampler step progress')
          write(p, s)

          # refine_sampling.py
          p = 'director/refine_sampling.py'
          s = read(p)
          s = replace_once(s, 'import logging\nfrom dataclasses import dataclass', 'import logging\nimport time\nfrom dataclasses import dataclass, field', 'refine timing imports')
          s = replace_once(s, '''@dataclass\nclass GlobalRefineOutcome:\n    samples: dict\n    status: str\n    fallback: str = ""\n    error: str = ""\n    target_width: int = 0\n    target_height: int = 0\n    steps: int = 0\n    seed: int = 0\n''', '''@dataclass\nclass GlobalRefineOutcome:\n    samples: dict\n    status: str\n    fallback: str = ""\n    error: str = ""\n    source_width: int = 0\n    source_height: int = 0\n    target_width: int = 0\n    target_height: int = 0\n    steps: int = 0\n    seed: int = 0\n    method: str = ""\n    vsr_quality: str = ""\n    timings: dict[str, float] = field(default_factory=dict)\n''', 'GlobalRefineOutcome diagnostics')
          s = replace_once(s, '''    refine_steps = refine_steps_for(config, first_steps)\n    refine_seed = refine_seed_for(config, seed)\n    width, height = int(director_width), int(director_height)\n    try:\n''', '''    refine_steps = refine_steps_for(config, first_steps)\n    refine_seed = refine_seed_for(config, seed)\n    width, height = int(director_width), int(director_height)\n    source_width, source_height = width, height\n    method = str(config.get("upscale_method") or "lanczos")\n    vsr_quality = str(config.get("vsr_quality") or "high")\n    timings: dict[str, float] = {}\n    stage_started = time.perf_counter()\n    try:\n''', 'global refine timer start')
          s = replace_once(s, '''            video_latent, audio_latent = _split_av(work)\n            decoded = _decode_video(vae, video_latent)\n            upscaled = upscale_image_batch_strict(\n''', '''            decode_started = time.perf_counter()\n            video_latent, audio_latent = _split_av(work)\n            decoded = _decode_video(vae, video_latent)\n            timings["decode"] = time.perf_counter() - decode_started\n            source_height = int(decoded.shape[1])\n            source_width = int(decoded.shape[2])\n            upscale_started = time.perf_counter()\n            upscaled = upscale_image_batch_strict(\n''', 'global refine decode/upscale timing')
          s = replace_once(s, '''                ),\n            )\n            work = _join_av(_encode_video(vae, upscaled), audio_latent, work)\n''', '''                ),\n            )\n            timings["upscale"] = time.perf_counter() - upscale_started\n            encode_started = time.perf_counter()\n            work = _join_av(_encode_video(vae, upscaled), audio_latent, work)\n            timings["encode"] = time.perf_counter() - encode_started\n''', 'global refine encode timing')
          s = replace_once(s, '''        refined = sample_single_stage(\n            model=model,\n''', '''        refine_sample_started = time.perf_counter()\n        refined = sample_single_stage(\n            model=model,\n''', 'global refine sample timer')
          s = replace_once(s, '''        if on_phase:\n            on_phase("global_refine", 1)\n        return GlobalRefineOutcome(\n            samples=refined,\n            status="SUCCESS",\n            target_width=width,\n            target_height=height,\n            steps=refine_steps,\n            seed=refine_seed,\n        )\n''', '''        timings["refine_sampling"] = time.perf_counter() - refine_sample_started\n        timings["total"] = time.perf_counter() - stage_started\n        if on_phase:\n            on_phase("global_refine", 1)\n        return GlobalRefineOutcome(\n            samples=refined, status="SUCCESS",\n            source_width=source_width, source_height=source_height,\n            target_width=width, target_height=height, steps=refine_steps, seed=refine_seed,\n            method=method, vsr_quality=vsr_quality, timings=timings,\n        )\n''', 'global refine success diagnostics')
          s = replace_once(s, '''        return GlobalRefineOutcome(\n            samples=samples,\n            status="FAILED",\n            fallback="FIRST_PASS_RESULT",\n            error=f"{type(exc).__name__}: {exc}",\n            target_width=width,\n            target_height=height,\n            steps=refine_steps,\n            seed=refine_seed,\n        )\n''', '''        timings["total"] = time.perf_counter() - stage_started\n        return GlobalRefineOutcome(\n            samples=samples, status="FAILED", fallback="FIRST_PASS_RESULT",\n            error=f"{type(exc).__name__}: {exc}",\n            source_width=source_width, source_height=source_height,\n            target_width=width, target_height=height, steps=refine_steps, seed=refine_seed,\n            method=method, vsr_quality=vsr_quality, timings=timings,\n        )\n''', 'global refine failure diagnostics')
          write(p, s)

          # face_refine_pipeline.py
          p = 'director/face_refine_pipeline.py'
          s = read(p)
          s = replace_once(s, 'import logging\nfrom dataclasses import dataclass, field', 'import logging\nimport time\nfrom dataclasses import dataclass, field', 'face timing import')
          s = replace_once(s, '    canvas: str = ""\n', '    canvas: str = ""\n    steps: int = 0\n    base_denoise: float = 0.0\n    timings: dict[str, Any] = field(default_factory=dict)\n', 'face outcome timing fields')
          s = replace_once(s, '''    if not config.get("enabled"):\n        return FaceRefineOutcome(images=images, status="DISABLED")\n    try:\n        if on_phase:\n            on_phase("face_refine", 0)\n        tracked = track_and_crop(images, config)\n        masks = build_sam_masks(tracked.crops, tracked.transform, config) if config.get("mask_mode") == "sam" else None\n        refined_parts = []\n''', '''    if not config.get("enabled"):\n        return FaceRefineOutcome(images=images, status="DISABLED")\n    stage_started = time.perf_counter()\n    timings: dict[str, Any] = {"sampling_chunks": []}\n    base_denoise = float(config.get("base_denoise") or 0.45)\n    try:\n        if on_phase:\n            on_phase("face_refine", 0)\n        detect_started = time.perf_counter()\n        tracked = track_and_crop(images, config)\n        timings["detection_tracking"] = time.perf_counter() - detect_started\n        if on_phase:\n            on_phase("face_refine", 0.08)\n        mask_started = time.perf_counter()\n        masks = build_sam_masks(tracked.crops, tracked.transform, config) if config.get("mask_mode") == "sam" else None\n        timings["mask"] = time.perf_counter() - mask_started\n        if on_phase:\n            on_phase("face_refine", 0.10)\n        refined_parts = []\n''', 'face stage timers')
          s = replace_once(s, '''            sampled = sample_single_stage(\n                model=model,\n''', '''            chunk_started = time.perf_counter()\n\n            def _chunk_phase(_phase: str, value: float) -> None:\n                if on_phase:\n                    fraction = (part_index + max(0.0, min(1.0, float(value)))) / max(1, len(ranges))\n                    on_phase("face_refine", 0.10 + 0.80 * fraction)\n\n            sampled = sample_single_stage(\n                model=model,\n''', 'face chunk timer')
          s = replace_once(s, '''                denoise=float(config.get("base_denoise") or 0.45),\n                phase_name="face_refine",\n                on_step_preview=on_step_preview,\n''', '''                denoise=base_denoise,\n                phase_name="face_refine",\n                on_phase=_chunk_phase,\n                on_step_preview=on_step_preview,\n''', 'face sampling step progress')
          s = replace_once(s, '''            refined_parts.append(decoded[: end - start])\n            tracked.statistics.update(denoise_stats)\n            if on_phase:\n                on_phase("face_refine", (part_index + 1) / len(ranges))\n''', '''            refined_parts.append(decoded[: end - start])\n            timings["sampling_chunks"].append(time.perf_counter() - chunk_started)\n            tracked.statistics.update(denoise_stats)\n''', 'face chunk timing finish')
          s = replace_once(s, '''        refined_crops = torch.cat(refined_parts, dim=0)\n        final = stitch_faces(images, refined_crops, tracked.transform, config, masks=masks)\n        return FaceRefineOutcome(\n            images=final.detach().cpu().float(),\n            status="SUCCESS",\n            statistics=tracked.statistics,\n            canvas=tracked.statistics["canvas"],\n        )\n''', '''        refined_crops = torch.cat(refined_parts, dim=0)\n        if on_phase:\n            on_phase("face_refine", 0.92)\n        stitch_started = time.perf_counter()\n        final = stitch_faces(images, refined_crops, tracked.transform, config, masks=masks)\n        timings["stitch"] = time.perf_counter() - stitch_started\n        timings["total"] = time.perf_counter() - stage_started\n        tracked.statistics["steps"] = int(steps)\n        tracked.statistics["base_denoise"] = base_denoise\n        if on_phase:\n            on_phase("face_refine", 1)\n        return FaceRefineOutcome(\n            images=final.detach().cpu().float(), status="SUCCESS",\n            statistics=tracked.statistics, canvas=tracked.statistics["canvas"],\n            steps=int(steps), base_denoise=base_denoise, timings=timings,\n        )\n''', 'face success timing')
          write(p, s)

          # executor_core.py
          p = 'director/executor_core.py'
          s = read(p)
          s = replace_once(s, 'import logging\nfrom typing import Any', 'import logging\nimport time\nfrom typing import Any', 'executor timing import')
          s = replace_once(s, '    """Process every segment with MiniMax H3 conditioning + single-stage sampling."""\n    legacy_preview =', '    """Process every segment with MiniMax H3 conditioning + single-stage sampling."""\n    core_started = time.perf_counter()\n    legacy_preview =', 'executor core timer start')
          s = replace_once(s, '    global_refine_outcomes: dict[int, Any] = {}\n', '    global_refine_outcomes: dict[int, Any] = {}\n    segment_stage_timings: dict[int, dict[str, float]] = {}\n', 'segment timing store')
          s = replace_once(s, '        timeline_slot = int(seg.timeline_index)\n        source_bridge_active =', '        timeline_slot = int(seg.timeline_index)\n        stage_times = segment_stage_timings.setdefault(timeline_slot, {})\n        source_bridge_active =', 'segment timing bind')
          s = replace_once(s, '        try:\n            samples = sample_single_stage(\n', '        _h3_sample_started = time.perf_counter()\n        try:\n            samples = sample_single_stage(\n', 'h3 sampling timer start')
          s = replace_once(s, '                preview_every=int(preview_config["preview_every"]),\n            )\n        except torch.cuda.OutOfMemoryError as exc:', '                preview_every=int(preview_config["preview_every"]),\n            )\n            stage_times["h3_sampling"] = time.perf_counter() - _h3_sample_started\n        except torch.cuda.OutOfMemoryError as exc:', 'h3 sampling timer finish')
          s = replace_once(s, '        decoded, audio_dict = _decode_av_latent(\n            samples, vae, audio_vae, decode_audio=decode_audio,\n        )\n', '        _decode_started = time.perf_counter()\n        decoded, audio_dict = _decode_av_latent(\n            samples, vae, audio_vae, decode_audio=decode_audio,\n        )\n        stage_times["av_decode"] = time.perf_counter() - _decode_started\n', 'segment decode timer')
          s = replace_once(s, '            chunk, audio_dict = _run_one_segment(\n                seg, progress_index=progress_pos[seg.index]\n            )\n            result = (chunk, audio_dict or {})\n', '            _segment_started = time.perf_counter()\n            chunk, audio_dict = _run_one_segment(\n                seg, progress_index=progress_pos[seg.index]\n            )\n            segment_stage_timings.setdefault(int(seg.timeline_index), {})["total"] = time.perf_counter() - _segment_started\n            result = (chunk, audio_dict or {})\n', 'segment total timer')

          # Time exactly the existing assembly interval between phase 0 and phase 1 reports.
          assemble_start = '''    report_director_progress(\n        node_id,\n        segment_index=max(0, seg_total - 1),\n        segment_total=max(1, seg_total),\n        phase="assemble",\n        phase_value=0,\n        phase_max=1,\n    )\n'''
          assemble_end = '''    report_director_progress(\n        node_id,\n        segment_index=max(0, seg_total - 1),\n        segment_total=max(1, seg_total),\n        phase="assemble",\n        phase_value=1,\n        phase_max=1,\n    )\n'''
          s = replace_once(s, assemble_start, assemble_start + '    _assembly_started = time.perf_counter()\n', 'assembly timer start')
          s = replace_once(s, assemble_end, '    assembly_seconds = time.perf_counter() - _assembly_started\n' + assemble_end, 'assembly timer finish')

          s = replace_once(s, '''        f"Seed Mode: {str(global_refine_config['seed_mode']).title()}",\n        f"Upscale Method: {global_refine_config['upscale_method']}",\n    )\n''', '''        f"Seed Mode: {str(global_refine_config['seed_mode']).title()}",\n        f"Upscale Method: {global_refine_config['upscale_method']}",\n        (f"VSR Quality: {str(global_refine_config.get('vsr_quality') or 'high').title()}"\n         if global_refine_config.get('mode') == 'upscale' and global_refine_config.get('upscale_method') == 'nvidia_rtx_vsr' else ""),\n    )\n''', 'global refine report quality')
          s = replace_once(s, '''                    f"S{slot + 1} Status: {outcome.status}",\n                    f"Target Resolution: {outcome.target_width}x{outcome.target_height}" if outcome.target_width else "",\n                    f"Error: {outcome.error}" if outcome.error else "",\n''', '''                    f"S{slot + 1} Status: {outcome.status}",\n                    f"Source Resolution: {outcome.source_width}x{outcome.source_height}" if outcome.source_width else "",\n                    f"Target Resolution: {outcome.target_width}x{outcome.target_height}" if outcome.target_width else "",\n                    (f"Scale: {outcome.target_width / max(1, outcome.source_width):.2f}x" if outcome.source_width and outcome.target_width else ""),\n                    ("Timing: " + ", ".join(f"{name}={value:.2f}s" for name, value in outcome.timings.items()) if outcome.timings else ""),\n                    f"Error: {outcome.error}" if outcome.error else "",\n''', 'global outcome report')
          s = replace_once(s, '''        f"Mask mode: {face_refine_config['mask_mode']}",\n        f"Status: {face_outcome.status}",\n        f"Detection statistics: {face_outcome.statistics or 'n/a'}",\n        f"Error: {face_outcome.error}" if face_outcome.error else "",\n''', '''        f"Mask mode: {face_refine_config['mask_mode']}",\n        f"Status: {face_outcome.status}",\n        (f"Frames: {int((face_outcome.statistics or {}).get('frames') or 0)}" if face_outcome.statistics else "Frames: n/a"),\n        (f"Detected: {int((face_outcome.statistics or {}).get('detected') or 0)} / {int((face_outcome.statistics or {}).get('frames') or 0)}" if face_outcome.statistics else ""),\n        (f"Detection Rate: {100.0 * int((face_outcome.statistics or {}).get('detected') or 0) / max(1, int((face_outcome.statistics or {}).get('frames') or 0)):.1f}%" if face_outcome.statistics else ""),\n        (f"Interpolated: {int((face_outcome.statistics or {}).get('interpolated') or 0)}" if face_outcome.statistics else ""),\n        (f"Face px min/mean/max: {float((face_outcome.statistics or {}).get('face_px_min') or 0):.1f} / {float((face_outcome.statistics or {}).get('face_px_mean') or 0):.1f} / {float((face_outcome.statistics or {}).get('face_px_max') or 0):.1f}" if face_outcome.statistics else ""),\n        (f"Steps: {int(face_outcome.steps)}" if face_outcome.steps else ""),\n        (f"Base Denoise: {float(face_outcome.base_denoise):g}" if face_outcome.base_denoise else ""),\n        (f"Adaptive Strength min/mean/max: {float((face_outcome.statistics or {}).get('denoise_min') or 0):.3f} / {float((face_outcome.statistics or {}).get('denoise_mean') or 0):.3f} / {float((face_outcome.statistics or {}).get('denoise_max') or 0):.3f}" if face_outcome.statistics and 'denoise_mean' in face_outcome.statistics else ""),\n        f"Error: {face_outcome.error}" if face_outcome.error else "",\n''', 'face readable report')

          timing_marker = '''    execution_report.add(\n        "Preview",\n'''
          timing_block = '''    core_seconds = time.perf_counter() - core_started\n    for slot, timing in sorted(segment_stage_timings.items()):\n        outcome = global_refine_outcomes.get(slot)\n        global_times = getattr(outcome, "timings", {}) if outcome is not None else {}\n        global_total = float(global_times.get("total", 0.0))\n        known = float(timing.get("h3_sampling", 0.0)) + float(timing.get("av_decode", 0.0)) + global_total\n        prepare_other = max(0.0, float(timing.get("total", 0.0)) - known)\n        execution_report.add(\n            "Timing",\n            f"S{slot + 1} Total: {float(timing.get('total', 0.0)):.2f}s",\n            f"  Prepare / Conditioning / Context: {prepare_other:.2f}s",\n            f"  H3 Sampling: {float(timing.get('h3_sampling', 0.0)):.2f}s",\n            (f"  Global Refine Decode: {float(global_times.get('decode', 0.0)):.2f}s" if global_times else ""),\n            (f"  Global Refine Upscale: {float(global_times.get('upscale', 0.0)):.2f}s" if global_times else ""),\n            (f"  Global Refine VAE Encode: {float(global_times.get('encode', 0.0)):.2f}s" if global_times else ""),\n            (f"  Global Refine H3 Sampling: {float(global_times.get('refine_sampling', 0.0)):.2f}s" if global_times else ""),\n            (f"  Global Refine Total: {global_total:.2f}s" if global_times else "  Global Refine Total: 0.00s"),\n            f"  AV Decode: {float(timing.get('av_decode', 0.0)):.2f}s",\n        )\n    execution_report.add("Timing", f"Assembly: {assembly_seconds:.2f}s")\n    if face_outcome.timings:\n        execution_report.add(\n            "Timing",\n            f"Face Refine Detection / Tracking: {float(face_outcome.timings.get('detection_tracking', 0.0)):.2f}s",\n            f"Face Refine Mask: {float(face_outcome.timings.get('mask', 0.0)):.2f}s",\n        )\n        for part_index, seconds in enumerate(face_outcome.timings.get("sampling_chunks", [])):\n            execution_report.add("Timing", f"Face Refine S{part_index + 1} Sampling: {float(seconds):.2f}s")\n        execution_report.add(\n            "Timing",\n            f"Face Refine Stitch: {float(face_outcome.timings.get('stitch', 0.0)):.2f}s",\n            f"Face Refine Total: {float(face_outcome.timings.get('total', 0.0)):.2f}s",\n        )\n    else:\n        execution_report.add("Timing", "Face Refine Total: 0.00s")\n    execution_report.add("Timing", f"Core Pipeline: {core_seconds:.2f}s")\n\n    execution_report.add(\n        "Preview",\n'''
          s = replace_once(s, timing_marker, timing_block, 'Timing report details')
          write(p, s)

          # nodes/director.py: include finalize + auto-save encode in final report.
          p = 'nodes/director.py'
          s = read(p)
          s = replace_once(s, 'from __future__ import annotations\n\nimport comfy.samplers', 'from __future__ import annotations\n\nimport time\n\nimport comfy.samplers', 'node time import')
          s = replace_once(s, 'from ..director.executor_core import execute_director_plan_core\n', 'from ..director.executor_core import execute_director_plan_core\nfrom ..director.execution_report import append_report_section_lines, fmt_seconds\n', 'timing helpers import')
          s = replace_once(s, '    ):\n        del kwargs\n\n        final_run_id =', '    ):\n        del kwargs\n        run_started = time.perf_counter()\n        auto_save_seconds = None\n\n        final_run_id =', 'run timer start')
          s = replace_once(s, '''        outputs = finalize_director_outputs(\n            plan,\n            combined,\n            segment_outputs,\n            report,\n            export_source_images=export_source_images,\n            segment_audios=segment_audios,\n        )\n        if final_run_id is not None:\n''', '''        outputs = finalize_director_outputs(\n            plan,\n            combined,\n            segment_outputs,\n            report,\n            export_source_images=export_source_images,\n            segment_audios=segment_audios,\n        )\n        pipeline_seconds = time.perf_counter() - run_started\n        if final_run_id is not None:\n''', 'pipeline timer')
          s = replace_once(s, '                record, auto_result = FINAL_VIDEO_REGISTRY.register_final(\n', '                _save_started = time.perf_counter()\n                record, auto_result = FINAL_VIDEO_REGISTRY.register_final(\n', 'save timer start')
          s = replace_once(s, '                final_payload = record.info()\n                if auto_result is not None:\n', '                if auto_result is not None:\n                    auto_save_seconds = time.perf_counter() - _save_started\n                final_payload = record.info()\n                if auto_result is not None:\n', 'save timer finish')
          s = replace_once(s, '''        report_director_report(unique_id, outputs[-1])\n        report_director_audio_preview(unique_id, outputs[1])\n        return outputs\n''', '''        timing_lines = [f"Pipeline Total: {fmt_seconds(pipeline_seconds)}"]\n        if auto_save_seconds is not None:\n            timing_lines.append(f"Video Encode / Auto Save: {fmt_seconds(auto_save_seconds)}")\n            timing_lines.append(f"End-to-end Total: {fmt_seconds(time.perf_counter() - run_started)}")\n        else:\n            timing_lines.append("Video Encode / Auto Save: DISABLED")\n            timing_lines.append("End-to-end Total: n/a (Auto Save disabled)")\n        outputs = (*outputs[:-1], append_report_section_lines(outputs[-1], "Timing", timing_lines))\n        report_director_report(unique_id, outputs[-1])\n        report_director_audio_preview(unique_id, outputs[1])\n        return outputs\n''', 'final Timing append')
          write(p, s)

          # frontend elapsed clocks.
          p = 'web/js/minimax_timeline.js'
          s = read(p)
          s = replace_once(s, '''        if (detail.frames_label) parts.push(detail.frames_label);\n        if (detail.task_key) parts.push(detail.task_key);\n        parts.push(t("run.detailOverall", { pct: overallPct }));\n''', '''        if (detail.frames_label) parts.push(detail.frames_label);\n        if (detail.task_key) parts.push(detail.task_key);\n        const elapsedSeconds = Math.max(0, Number(detail.elapsed_seconds) || 0);\n        const phaseElapsedSeconds = Math.max(0, Number(detail.phase_elapsed_seconds) || 0);\n        const fmtElapsed = (seconds) => {\n            if (seconds < 60) return `${seconds.toFixed(1)}s`;\n            const minutes = Math.floor(seconds / 60);\n            const remainSeconds = Math.floor(seconds % 60);\n            return `${String(minutes).padStart(2, "0")}:${String(remainSeconds).padStart(2, "0")}`;\n        };\n        if (elapsedSeconds > 0) parts.push(`已用 ${fmtElapsed(elapsedSeconds)}`);\n        if (phaseElapsedSeconds > 0) parts.push(`当前阶段 ${fmtElapsed(phaseElapsedSeconds)}`);\n        parts.push(t("run.detailOverall", { pct: overallPct }));\n''', 'frontend elapsed time')
          write(p, s)
          PY

      - name: Verify implementation
        shell: bash
        run: |
          python -m pytest -q tests/test_execution_report_timing.py tests/test_progress_precision_static.py tests/test_postprocess_config.py
          node web/js/tests/minimax_progress_elapsed.test.mjs
          node web/js/tests/minimax_postprocess_ui.test.mjs
          node web/js/tests/minimax_postprocess_bootstrap.test.mjs
          node --check web/js/minimax_timeline.js
          node --check web/js/minimax_postprocess_ui.mjs
          python -m py_compile director/execution_report.py director/progress.py director/core_sampling.py director/refine_sampling.py director/face_refine_pipeline.py director/executor_core.py nodes/director.py
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report_timing_progress_once.yml .github/workflows/report_timing_progress_fix_once.yml
          git add director/execution_report.py director/progress.py director/core_sampling.py director/refine_sampling.py director/face_refine_pipeline.py director/executor_core.py nodes/director.py web/js/minimax_timeline.js tests/test_execution_report_timing.py tests/test_progress_precision_static.py web/js/tests/minimax_progress_elapsed.test.mjs
          git commit -m "feat: add precise progress and execution timings"
          git push origin HEAD:main
