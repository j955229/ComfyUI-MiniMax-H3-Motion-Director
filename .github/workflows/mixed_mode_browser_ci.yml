name: Mixed Mode Browser CI

on:
  push:
    branches:
      - feature/mixed-mode
  pull_request:
    paths:
      - "web/js/minimax_mixed_*.mjs"
      - "web/js/zz_minimax_mixed_mode.js"
      - "web/js/zzz_minimax_mixed_persistence.js"
      - "web/js/tests/minimax_mixed_lifecycle.smoke.mjs"
      - ".github/workflows/mixed_mode_browser_ci.yml"

permissions:
  contents: read

jobs:
  mixed-browser-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jsdom for isolated browser smoke
        run: npm install --no-save --ignore-scripts jsdom@26

      - name: Provide Comfy frontend stubs
        run: |
          mkdir -p scripts
          cat > scripts/app.js <<'EOF'
          export const __extensions = [];
          export const app = {
            registerExtension(extension) {
              __extensions.push(extension);
            },
          };
          EOF
          cat > scripts/api.js <<'EOF'
          export const api = {
            apiURL: (value) => value,
            fetchApi: async () => ({
              ok: true,
              json: async () => ({ items: [] }),
              text: async () => "",
            }),
            addEventListener: () => {},
            removeEventListener: () => {},
          };
          EOF

      - name: Check Mixed lifecycle extensions
        run: |
          node --check web/js/zz_minimax_mixed_mode.js
          node --check web/js/zzz_minimax_mixed_persistence.js
          node --check web/js/tests/minimax_mixed_lifecycle.smoke.mjs

      - name: Run Mixed workflow lifecycle smoke
        run: node web/js/tests/minimax_mixed_lifecycle.smoke.mjs
