name: Apply Mixed Context Length Visibility

on:
  push:
    branches:
      - feature/mixed-mode
    paths:
      - '.github/scripts/fix_mixed_context_length_visibility.py'
      - '.github/workflows/apply_mixed_context_length_visibility.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mixed-mode
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/fix_mixed_context_length_visibility.py
      - name: Verify syntax and Mixed continuity UI contract
        run: |
          node --check web/js/minimax_timeline.js
          node --check web/js/minimax_continuity_ui.mjs
          node --input-type=module - <<'NODE'
          import { resolveContinuityUiState } from './web/js/minimax_continuity_ui.mjs';
          const state = resolveContinuityUiState({ taskKey: 'mixed', segmentCount: 4 });
          if (!state.showContextFrames || !state.contextFramesControlEnabled) {
            throw new Error(`Mixed Context Length must be visible and enabled: ${JSON.stringify(state)}`);
          }
          if (state.showMotionContext || state.showAudioContinuation) {
            throw new Error(`Mixed must not expose legacy master toggles: ${JSON.stringify(state)}`);
          }
          NODE
          grep -q 'minimax_continuity_ui.mjs?boot=director_ui_v4' web/js/minimax_timeline.js
          grep -q 'Mixed segment count controls which global continuity tuning' web/js/minimax_timeline.js
      - name: Commit fix
        run: |
          git config user.name 'j955229'
          git config user.email '120770154+j955229@users.noreply.github.com'
          git add web/js/minimax_timeline.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show Mixed Context Length on Director node'
          git push origin HEAD:feature/mixed-mode
