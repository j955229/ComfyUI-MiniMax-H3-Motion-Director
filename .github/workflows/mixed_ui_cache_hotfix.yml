name: One-shot Mixed UI cache-key hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mixed_ui_cache_hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm regression test is RED before fix
        shell: bash
        run: |
          if node web/js/tests/minimax_mixed_cache_key.test.mjs; then
            echo "Expected the cache-key regression test to fail before the fix."
            exit 1
          fi
          echo "RED confirmed: production still points at stale Mixed UI module keys."

      - name: Patch exact Mixed UI module keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path("web/js/minimax_timeline.js"),
                  'from "./minimax_mixed_ui.mjs?boot=mixed_native_v7";',
                  'from "./minimax_mixed_ui.mjs?boot=mixed_issue16_v2";',
              ),
              (
                  Path("web/js/zz_minimax_director_runtime_fix.js"),
                  'from "./minimax_mixed_ui.mjs?boot=mixed_native_v8";',
                  'from "./minimax_mixed_ui.mjs?boot=mixed_issue16_v2";',
              ),
              (
                  Path("web/js/minimax_mixed_ui.mjs"),
                  'from "./minimax_mixed_interactions.mjs?boot=issue16_v1";',
                  'from "./minimax_mixed_interactions.mjs?boot=issue16_v2";',
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              print(f"patched {path}")
          PY

      - name: Verify GREEN and syntax
        shell: bash
        run: |
          node web/js/tests/minimax_mixed_cache_key.test.mjs
          node web/js/tests/minimax_mixed_interactions.test.mjs
          node --check web/js/minimax_mixed_ui.mjs
          node --check web/js/minimax_mixed_interactions.mjs
          node --check web/js/zz_minimax_director_runtime_fix.js
          node --check web/js/minimax_timeline.js
          git diff --check

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mixed_ui_cache_hotfix.yml
          git add web/js/minimax_timeline.js web/js/zz_minimax_director_runtime_fix.js web/js/minimax_mixed_ui.mjs web/js/tests/minimax_mixed_cache_key.test.mjs
          git diff --cached --check
          git commit -m "fix: force-load Issue 16 Mixed UI bundle"
          git push origin HEAD:main
