name: Mixed Mode CI

on:
  push:
    branches:
      - feature/mixed-mode
  pull_request:
    paths:
      - "director/mixed_*.py"
      - "director/cache_path.py"
      - "director/context_identity.py"
      - "director/segment_runtime.py"
      - "director/source_bridge.py"
      - "nodes/director.py"
      - "nodes/director_common.py"
      - "lib/task_prompts.py"
      - "web/js/minimax_director_inputs_core.mjs"
      - "web/js/minimax_gen_timeline.js"
      - "web/js/minimax_timeline.js"
      - "web/js/minimax_mixed_*.mjs"
      - "web/js/tests/minimax_mixed_*.mjs"
      - "tests/test_mixed_*.py"
      - "tests/test_cache_path.py"
      - "tests/test_context_identity_seed.py"
      - ".github/workflows/mixed_mode_ci.yml"

permissions:
  contents: read

jobs:
  mixed-static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify synchronized main baseline
        run: |
          grep -F 'version = "1.0.3"' pyproject.toml

      - name: Compile Python modules
        run: |
          python -m py_compile \
            director/mixed_schema.py \
            director/mixed_plan.py \
            director/mixed_runtime.py \
            director/mixed_selection.py \
            director/cache_path.py \
            director/context_identity.py \
            director/segment_runtime.py \
            director/source_bridge.py \
            nodes/director.py \
            nodes/director_common.py \
            lib/task_prompts.py

      - name: Verify canonical Mixed test checkout
        run: |
          grep -F 'test_legacy_previous_result_migrates_and_suppresses_i2v_visual_context' tests/test_mixed_schema.py
          grep -F '"origin": "segment"' tests/test_mixed_schema.py
          ! grep -F 'test_previous_segment_reference_tracks_reorder' tests/test_mixed_schema.py

      - name: Run pure Python Mixed and synced-main tests
        shell: bash
        run: |
          # Discover directly from this repository's tests directory. This avoids
          # an unrelated installed top-level `tests` package shadowing the repo.
          # Capture each suite separately so a failing unittest traceback is also
          # surfaced as a check annotation for API-only CI debugging.
          run_suite() {
            local label="$1"
            local pattern="$2"
            local log
            log="$(mktemp)"

            if python -m unittest discover -v -s tests -p "$pattern" 2>&1 | tee "$log"; then
              rm -f "$log"
              return 0
            fi

            local message
            message="$(python - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-12000:]
          print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          )"
            echo "::error title=${label} failed::${message}"
            rm -f "$log"
            return 1
          }

          failed=0
          run_suite "Mixed tests" "test_mixed_*.py" || failed=1
          run_suite "Cache path tests" "test_cache_path.py" || failed=1
          run_suite "Context identity seed tests" "test_context_identity_seed.py" || failed=1
          exit "$failed"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Mixed JavaScript syntax
        run: |
          node --check web/js/minimax_director_inputs_core.mjs
          node --check web/js/minimax_gen_timeline.js
          node --check web/js/minimax_timeline.js
          node --check web/js/minimax_mixed_state.mjs
          node --check web/js/minimax_mixed_ui.mjs
          node --check web/js/minimax_mixed_ui_v2.mjs
          node --check web/js/minimax_mixed_i18n.mjs
          node --check web/js/minimax_mixed_material_picker.mjs
          node --check web/js/tests/minimax_mixed_native_contract.test.mjs
          node --check web/js/tests/minimax_mixed_mode_inputs.test.mjs

      - name: Run Mixed frontend state tests
        run: |
          node web/js/tests/minimax_mixed_state.test.mjs
          node web/js/tests/minimax_mixed_native_contract.test.mjs